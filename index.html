<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fútbol 7 — Miércoles</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090d16; --surface: #111827; --surface-2: #1e293b; --border: #26334d;
      --text: #f8fafc; --muted: #94a3b8; --emerald: #10b981; --emerald-dim: rgba(16,185,129,0.14);
      --amber: #f59e0b; --amber-dim: rgba(245,158,11,0.14); --rose: #f43f5e; --rose-dim: rgba(244,63,94,0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .container { max-width: 820px; margin: 0 auto; padding: 14px; }

    /* Login Modal */
    .login-screen { position: fixed; inset: 0; background: rgba(9,13,22,0.96); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 480px; padding: 20px; }
    .player-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 310px; overflow-y: auto; margin: 14px 0; }
    .player-chip { padding: 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 0.83rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .player-chip.selected { border-color: var(--emerald); background: var(--emerald-dim); color: #6ee7b7; }

    /* Header & Tabs */
    .topbar { background: rgba(17,24,39,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; padding: 10px 14px; }
    .topbar-inner { max-width: 820px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 0.95rem; }
    .brand-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--emerald); display: grid; place-items: center; }
    .user-pill { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .admin-tag { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.4); padding: 2px 5px; border-radius: 4px; font-size: 0.62rem; font-weight: 800; }

    .nav-tabs { display: flex; gap: 8px; margin: 12px 0 16px; overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 95px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--emerald-dim); color: var(--emerald); border-color: var(--emerald); }
    .tab-btn.admin-tab.active { background: var(--amber-dim); color: var(--amber); border-color: var(--amber); }

    /* Cards & Layout */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .card-title { font-size: 0.92rem; font-weight: 800; }
    .badge { padding: 4px 9px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
    .badge-emerald { background: var(--emerald-dim); color: #34d399; }
    .badge-amber { background: var(--amber-dim); color: #fbbf24; }

    .scoreboard { background: #0d1322; border: 1px solid var(--border); border-radius: 14px; padding: 16px 12px; text-align: center; margin-bottom: 12px; }
    .score-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .score-num { font-size: 2rem; font-weight: 800; background: #090d16; padding: 5px 14px; border-radius: 10px; border: 1px solid var(--border); }

    .quorum-grid, .awards-row, .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .quorum-grid, .awards-row, .stats-grid { grid-template-columns: 1fr; } }
    .quorum-box { background: #0d1322; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .progress-track { height: 6px; background: #090d16; border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; background: var(--emerald); transition: width 0.3s; }

    .award-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 11px; display: flex; align-items: center; gap: 10px; }
    .rank-list { display: flex; flex-direction: column; gap: 7px; }
    .rank-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: rgba(30,41,59,0.5); border-radius: 9px; font-size: 0.82rem; }
    .avatar { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; font-size: 0.68rem; font-weight: 800; color: var(--emerald); flex-shrink: 0; }
